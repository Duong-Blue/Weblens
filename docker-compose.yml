services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./weblens-backend
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./weblens-backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  worker:
    build:
      context: ./weblens-backend
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ./weblens-backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  frontend:
    build:
      context: ./weblens-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
